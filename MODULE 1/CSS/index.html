<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Community Portal</title>
<link rel="stylesheet" href="styles.css">

<script src="main.js"></script>
</head>
<body>

<nav>
<a href="#home">Home</a> |
<a href="#events">Events</a> |
<a href="#contact">Contact</a>
</nav>

<div id="welcome">Welcome to Community Portal <span style="color:red">By Vishwa</span></div>

<section id="home">
<h2>Home</h2>
<p>Community Event Portal</p>
</section>

<section id="events">
<h2>Gallery</h2>
<table border="1">
<tr>
<td><img src="https://i.postimg.cc/7PWfjk9p/Deep-Royal-Maroon-Chettinad-Cotton-Salwar-3.webp" width="100" alt="Event1"></td>
<td><img src="https://i.postimg.cc/QNyHv3SG/Saffron-Orange-Chettinad-Cotton-Salwar-1.webp" width="100" alt="Event2"></td>
<td><img src="https://i.postimg.cc/L5w5PthL/352A8212.webp" width="100" alt="Event3"></td>
</tr>
</table>

<h2>Registration</h2>
<form>
<label>Name:</label><br>
<input type="text" placeholder="Name" required autofocus><br><br>
<label>Email:</label><br>
<input type="email" placeholder="Email" required><br><br>
<input type="date"><br><br>

<select id="e" onchange="fee();save();">
<option>Music</option>
<option>Sports</option>
<option>Workshop</option>
</select>

<p id="f"></p>

<textarea id="fb" onkeyup="count()" placeholder="Feedback"></textarea>
<p>Characters: <span id="c">0</span></p>

<button type="button" onclick="reg()">Register</button>
</form>

<h2>Video</h2>
<video width="200" controls>
<source src="Vid 2.mp4" type="video/mp4">
</video>

<h2>Nearby Events</h2>
<button onclick="locate()">Find Location</button>
<p id="loc"></p>
</section>

<section id="contact">
<h2>Contact</h2>
<p>poorni@gmail.com</p>
</section>

<footer>
<p>© Community Portal</p>
</footer>

</body>
</html>
