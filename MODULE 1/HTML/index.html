<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Community Portal</title>

<style>
body{font-family:Arial}
nav{background:black;padding:10px}
nav a{color:white;margin:10px;}
#welcomeBanner{background:lightblue;padding:10px}
.highlight{background:yellow;padding:5px}
.gallery img{width:200px;height:150px;border:1px solid}
input,select,textarea{width:100%;margin:5px 0}
button{padding:5px}
footer{text-align:center}
</style>

<script>
function validatePhone(){
    let p=document.getElementById("phone").value;
    if(p.length!=10)
        alert("Enter 10 digit phone number");
}

function showFee(){
    let e=document.getElementById("eventType").value;

    document.getElementById("fee").innerHTML=
    e=="Music" ? "Fee : ₹500" :
    e=="Sports" ? "Fee : ₹300" :
    "Fee : ₹700";
}

function registerEvent(){
    alert("Registration Successful");
}

function enlarge(img){
    img.style.width="300px";
    img.style.height="200px";
}

function countChar(){
    document.getElementById("charCount").innerHTML=
    document.getElementById("feedback").value.length;
}
</script>
</head>

<body>

<nav>
<a href="#">Home</a>
<a href="#events">Events</a>
<a href="#contact">Contact</a>
<a href="help.html">Help</a>
</nav>

<div id="welcomeBanner">
Welcome to Community Event Portal
<span style="color:red">By Vishwa</span>
</div>

<h2 class="highlight">Upcoming Community Events</h2>

<section id="events">

<h3>Event Gallery</h3>

<div class="gallery">
<img src="img 1.jpg" ondblclick="enlarge(this)">
<img src="img 2.jpg" ondblclick="enlarge(this)">
<img src="img 3.jpg" ondblclick="enlarge(this)">
<img src="img 4.jpg" ondblclick="enlarge(this)">
<img src="img 5.jpg" ondblclick="enlarge(this)">
<img src="img 6.jpg" ondblclick="enlarge(this)">
</div>

</section>

<h3>Event Registration</h3>

<form>
<label>Name:</label>
<input type="text" placeholder="Name" required autofocus>
<label>Email:</label>
<input type="email" placeholder="Email" required>
<label>Phone no:</label>
<input type="text" id="phone" placeholder="Phone" onblur="validatePhone()">
<label>Date:</label>
<input type="date">

<select id="eventType" onchange="showFee()">
<option>Music</option>
<option>Sports</option>
<option>Workshop</option>
</select>

<p id="fee"></p>

<textarea placeholder="Message"></textarea>

<textarea id="feedback" placeholder="Feedback" onkeyup="countChar()"></textarea>

<p id="charCount">Characters : 0</p>

<button type="button" onclick="registerEvent()">Register</button>



<br><br>

<output id="outputMsg"></output>

</form>

<h3>Event Promo Video</h3>

<video width="400" controls oncanplay="videoReady()">
<source src="dog video.mp4" type="video/mp4">
</video>

<p id="videoMsg"></p>

<h3>Find Nearby Events</h3>

<button onclick="findLocation()">Find Nearby Events</button>

<p id="location"></p>

<footer id="contact">
<h3>Contact Us</h3>
<p>Email : communityportal@gmail.com</p>
<p>Phone : 9876543210</p>
</footer>

</body>
</html>
